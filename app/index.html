<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Vice City Cover Maker</h1>
    <p id="tagline">Turn your photos into a Vice City sunset cover.</p>
  </header>

  <main id="workspace">
    <section id="previewPane">
      <canvas id="coverCanvas" width="1080" height="1080"></canvas>
      <p id="hint">Click a panel to select it, drag to move the photo, scroll to zoom.</p>
    </section>

    <aside id="controls">
      <section class="controlGroup">
        <h2>Photos</h2>
        <label class="fileLabel">Photo 1
          <input type="file" id="photo1" accept="image/*">
        </label>
        <label class="fileLabel">Photo 2
          <input type="file" id="photo2" accept="image/*">
        </label>
        <label class="fileLabel">Photo 3
          <input type="file" id="photo3" accept="image/*">
        </label>
      </section>

      <section class="controlGroup">
        <h2>Caption</h2>
        <label>Main caption
          <input type="text" id="captionInput" value="VICE CITY" maxlength="40">
        </label>
        <label>Sub-caption
          <input type="text" id="subCaptionInput" value="SUNSET HEIST" maxlength="40">
        </label>
      </section>

      <section class="controlGroup">
        <h2>Size</h2>
        <label>Post size
          <select id="sizeSelect">
            <option value="1080x1080" selected>Square 1080 x 1080</option>
            <option value="1080x1350">Portrait 1080 x 1350</option>
            <option value="1920x1080">Wide 1920 x 1080</option>
          </select>
        </label>
      </section>

      <section class="controlGroup">
        <h2>Layout</h2>
        <div id="layoutRow">
          <button type="button" class="layout-btn" data-layout="classic">Classic</button>
          <button type="button" class="layout-btn active" data-layout="five-panel">Five-panel</button>
          <button type="button" class="layout-btn" data-layout="full-bleed">Full-bleed</button>
        </div>
      </section>

      <section class="controlGroup">
        <h2>Colour grade</h2>
        <label>Grade
          <select id="gradeSelect">
            <option value="sunset" selected>Sunset</option>
            <option value="neon-night">Neon Night</option>
            <option value="vice-pink">Vice Pink</option>
            <option value="golden-hour">Golden Hour</option>
            <option value="midnight-teal">Midnight Teal</option>
          </select>
        </label>
      </section>

      <section class="controlGroup">
        <h2>Selected panel</h2>
        <p id="selectedPanel">Panel 1 of 5</p>
        <label>Zoom
          <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1.1">
        </label>
        <label>Position X
          <input type="range" id="focusXSlider" min="0" max="1" step="0.01" value="0.5">
        </label>
        <label>Position Y
          <input type="range" id="focusYSlider" min="0" max="1" step="0.01" value="0.5">
        </label>
      </section>

      <button type="button" id="exportBtn">Export PNG</button>
      <p id="statusLine" role="status">Ready. Load a photo to begin.</p>
    </aside>
  </main>
</div>

<script src="src/cover.js"></script>
<script src="src/main.js"></script>
<script src="src/shots.js"></script>
</body>
</html>
