<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%237e22ce'/%3E%3Ccircle cx='16' cy='13' r='7' fill='%23ffd166'/%3E%3Crect y='22' width='32' height='10' fill='%23db2777'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <h1>Vice City Cover Maker</h1>
  <p class="tagline">Your photos. One caption. A sunset-soaked multi-panel cover, ready to post.</p>
</header>

<main id="workspace">
  <section id="previewPane">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p id="hint">Click a panel to select it &middot; drag to move the photo &middot; scroll to zoom.</p>
  </section>

  <aside id="controls">
    <div class="group">
      <h2>Photos</h2>
      <label class="field">Photo 1
        <input type="file" id="photo1" accept="image/*">
      </label>
      <label class="field">Photo 2
        <input type="file" id="photo2" accept="image/*">
      </label>
      <label class="field">Photo 3
        <input type="file" id="photo3" accept="image/*">
      </label>
    </div>

    <div class="group">
      <h2>Caption</h2>
      <label class="field">Main caption
        <input type="text" id="captionInput" value="VICE CITY" maxlength="40" autocomplete="off">
      </label>
      <label class="field">Sub-caption
        <input type="text" id="subCaptionInput" value="SUNSET HEIST" maxlength="40" autocomplete="off">
      </label>
    </div>

    <div class="group">
      <h2>Cover</h2>
      <label class="field">Post size
        <select id="sizeSelect">
          <option value="1080x1080" selected>Square &mdash; 1080 &times; 1080</option>
          <option value="1080x1350">Portrait &mdash; 1080 &times; 1350</option>
          <option value="1920x1080">Wide &mdash; 1920 &times; 1080</option>
        </select>
      </label>
      <div class="field">Layout
        <div class="btnRow" id="layoutRow">
          <button type="button" class="layout-btn" data-layout="classic">Classic</button>
          <button type="button" class="layout-btn active" data-layout="five-panel">Five-panel</button>
          <button type="button" class="layout-btn" data-layout="full-bleed">Full-bleed</button>
        </div>
      </div>
      <label class="field">Colour grade
        <select id="gradeSelect">
          <option value="sunset" selected>Sunset</option>
          <option value="neon-night">Neon Night</option>
          <option value="vice-pink">Vice Pink</option>
          <option value="golden-hour">Golden Hour</option>
          <option value="midnight-teal">Midnight Teal</option>
        </select>
      </label>
    </div>

    <div class="group">
      <h2>Selected panel</h2>
      <p id="selectedPanel">Panel 1 of 5</p>
      <label class="field">Zoom
        <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1.1">
      </label>
      <label class="field">Focus X
        <input type="range" id="focusXSlider" min="0" max="1" step="0.01" value="0.5">
      </label>
      <label class="field">Focus Y
        <input type="range" id="focusYSlider" min="0" max="1" step="0.01" value="0.5">
      </label>
    </div>

    <button type="button" id="exportBtn">Export PNG</button>
    <p id="statusLine" role="status">Loading the sample photo&hellip;</p>
  </aside>
</main>

<script src="src/cover.js"></script>
<script src="src/main.js"></script>
<script src="src/shots.js"></script>
</body>
</html>
